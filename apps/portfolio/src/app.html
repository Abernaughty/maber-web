<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="%sveltekit.assets%/images/mabear-icon.png" />

		<!-- Preload variable fonts so the typed Hero animation has the right
		     glyphs available before paint. Italic faces are not preloaded —
		     they're rare enough on this page that on-demand fetch is fine. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
